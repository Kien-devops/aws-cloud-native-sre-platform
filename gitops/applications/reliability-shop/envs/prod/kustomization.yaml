apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reliability-shop-prod

resources:
  - ../../base

labels:
  - pairs:
      environment: prod

patches:
  - target:
      kind: Ingress
      name: reliability-shop-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shop-prod.dev.devopsss.site
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1group.order
        value: "12"

