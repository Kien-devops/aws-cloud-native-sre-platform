apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service
  namespace: reliability-shop
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: reliability-shop
spec:
  replicas: 5
  strategy:
    canary:
      stableService: order-service-stable
      canaryService: order-service-canary
      analysis:
        templates:
          - templateName: order-service-metrics-check
      steps:
        - setWeight: 20
        - pause: { duration: 1m }
        - setWeight: 50
        - pause: { duration: 2m }
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      serviceAccountName: reliability-shop-sa
      initContainers:
        - name: opentelemetry-auto-instrumentation
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:latest
          command: ["cp", "-r", "/autoinstrumentation/.", "/otel-auto-instrumentation"]
          volumeMounts:
            - name: opentelemetry-auto-instrumentation
              mountPath: /otel-auto-instrumentation
      containers:
        - name: app
          image: reliabilityshop/order-service:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "order-service"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: DB_PASSWORD
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: REDIS_AUTH
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: opentelemetry-auto-instrumentation
              mountPath: /otel-auto-instrumentation
      volumes:
        - name: opentelemetry-auto-instrumentation
          emptyDir: {}
