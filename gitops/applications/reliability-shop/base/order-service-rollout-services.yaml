apiVersion: v1
kind: Service
metadata:
  name: order-service-stable
  namespace: reliability-shop
  labels:
    app.kubernetes.io/name: order-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: order-service
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-canary
  namespace: reliability-shop
  labels:
    app.kubernetes.io/name: order-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: order-service
