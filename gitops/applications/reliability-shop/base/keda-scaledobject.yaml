apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials
  namespace: reliability-shop
  labels:
    app.kubernetes.io/name: keda-aws-credentials
    app.kubernetes.io/part-of: reliability-shop
spec:
  podIdentity:
    provider: aws-eks
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-worker-scaler
  namespace: reliability-shop
  labels:
    app.kubernetes.io/name: payment-worker-scaler
    app.kubernetes.io/part-of: reliability-shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-worker
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-credentials
      metadata:
        queueURL: https://sqs.ap-southeast-1.amazonaws.com/620306387033/reliability-shop-dev-order-queue
        queueLength: "5"
        awsRegion: ap-southeast-1
        identityOwner: operator
