apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-shop-frontend
  namespace: reliability-shop
  labels:
    app: reliability-shop-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reliability-shop-frontend
  template:
    metadata:
      labels:
        app: reliability-shop-frontend
    spec:
      containers:
        - name: web
          image: public.ecr.aws/nginx/nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reliability-shop-frontend
  namespace: reliability-shop
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: reliability-shop-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reliability-shop-ingress
  namespace: reliability-shop
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: sg-067f16ca5bd986a83
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:620306387033:certificate/6af0c1dd-cbf4-4560-84b7-51e7cda7a69a
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  rules:
    - host: shop.dev.devopsss.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reliability-shop-frontend
                port:
                  number: 80

