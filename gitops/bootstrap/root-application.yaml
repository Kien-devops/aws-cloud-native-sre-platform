apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-platform-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: sre-platform-root
    app.kubernetes.io/part-of: sre-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Kien-devops/aws-cloud-native-sre-platform.git
    targetRevision: HEAD
    path: gitops/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

