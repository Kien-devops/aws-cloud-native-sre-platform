apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: sre-platform-dev-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: sre-platform-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: sre-platform-dev
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    Environment: dev
    ManagedBy: karpenter
    Project: sre-platform
