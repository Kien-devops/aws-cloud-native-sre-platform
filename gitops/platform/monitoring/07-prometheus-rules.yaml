apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector-monitor
  namespace: monitoring
  labels:
    release: prometheus
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  endpoints:
    - port: prometheus-metrics
      interval: 15s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: reliability-shop-slo-alerts
  namespace: monitoring
  labels:
    role: alert-rules
    release: prometheus
spec:
  groups:
    - name: ReliabilityShop-ErrorBudget-MultiWindow
      rules:
        # Multi-Window Multi-Burn-Rate 1: 14.4x burn rate (1h window / 5m sub-window) - Pager alert
        - alert: ErrorBudgetBurnRateCritical
          expr: |
            (
              (sum(rate(otel_http_server_duration_milliseconds_count{http_status_code=~"5.."}[1h])) or sum(rate(http_requests_total{status=~"5.."}[1h])) or vector(0))
              /
              (sum(rate(otel_http_server_duration_milliseconds_count[1h])) or sum(rate(http_requests_total[1h])) or vector(1))
            ) / 0.001 > 14.4
            and
            (
              (sum(rate(otel_http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m])) or sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0))
              /
              (sum(rate(otel_http_server_duration_milliseconds_count[5m])) or sum(rate(http_requests_total[5m])) or vector(1))
            ) / 0.001 > 14.4
          for: 2m
          labels:
            severity: critical
            service: order-service
            tier: payment
          annotations:
            summary: "Critical Error Budget Burn Rate (14.4x) - 2% budget consumed in 1 hour"
            description: "High error rate consumes more than 2% of the monthly error budget in 1 hour. Multi-window confirms high sustained burn rate."
            runbook_url: "https://github.com/Kien-devops/aws-cloud-native-sre-platform/blob/main/sre/runbooks/high-error-rate.md"

        # Multi-Window Multi-Burn-Rate 2: 6x burn rate (6h window / 30m sub-window) - Ticket alert
        - alert: ErrorBudgetBurnRateWarning
          expr: |
            (
              (sum(rate(otel_http_server_duration_milliseconds_count{http_status_code=~"5.."}[6h])) or sum(rate(http_requests_total{status=~"5.."}[6h])) or vector(0))
              /
              (sum(rate(otel_http_server_duration_milliseconds_count[6h])) or sum(rate(http_requests_total[6h])) or vector(1))
            ) / 0.001 > 6
            and
            (
              (sum(rate(otel_http_server_duration_milliseconds_count{http_status_code=~"5.."}[30m])) or sum(rate(http_requests_total{status=~"5.."}[30m])) or vector(0))
              /
              (sum(rate(otel_http_server_duration_milliseconds_count[30m])) or sum(rate(http_requests_total[30m])) or vector(1))
            ) / 0.001 > 6
          for: 15m
          labels:
            severity: warning
            service: order-service
            tier: payment
          annotations:
            summary: "Elevated Error Budget Burn Rate (6x) - 5% budget consumed in 6 hours"
            description: "Sustained moderate error rate consuming budget steadily across a 6h window."
            runbook_url: "https://github.com/Kien-devops/aws-cloud-native-sre-platform/blob/main/sre/runbooks/high-error-rate.md"
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: sre-alert-routing
  namespace: monitoring
  labels:
    release: prometheus
spec:
  route:
    groupBy: ['alertname', 'service', 'severity']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: 'default-webhook'
    routes:
      - matchers:
          - name: severity
            value: critical
        receiver: 'critical-pager'
  receivers:
    - name: 'default-webhook'
      webhookConfigs:
        - url: 'http://localhost:8080/webhook'
          sendResolved: true
    - name: 'critical-pager'
      webhookConfigs:
        - url: 'http://localhost:8080/pager'
          sendResolved: true
